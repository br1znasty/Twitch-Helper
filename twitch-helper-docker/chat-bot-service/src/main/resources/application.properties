spring.application.name=chat-bot-service
server.port=8080
server.address=0.0.0.0

# Database
spring.datasource.url=jdbc:postgresql://db:5432/twitch_helper
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Twitch Bot Credentials
twitch.bot.username=${TWITCH_BOT_USERNAME:your_bot_username}
twitch.bot.oauth-token=${TWITCH_BOT_OAUTH_TOKEN:oauth:your_token}
twitch.channel.name=${TWITCH_CHANNEL_NAME:your_channel}