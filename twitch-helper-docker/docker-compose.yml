services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: twitch-helper-db
    environment:
      POSTGRES_DB: twitch_helper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twitch-helper-backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twitch-helper-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: