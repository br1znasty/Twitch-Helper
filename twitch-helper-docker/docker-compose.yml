services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: twitch-helper-db
    environment:
      POSTGRES_DB: twitch_helper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: twitch-helper-auth-service
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8080"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: twitch-helper-user-service
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8080"

  twitch-service:
    build:
      context: ./twitch-service
      dockerfile: Dockerfile
    container_name: twitch-helper-twitch-service
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8083:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twitch-helper-frontend
    depends_on:
      - auth-service
      - user-service
      - twitch-service
    ports:
      - "3000:3000"

volumes:
  postgres_data: