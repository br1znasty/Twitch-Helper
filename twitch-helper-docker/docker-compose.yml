services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: twitch-helper-db
    environment:
      POSTGRES_DB: twitch_helper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d twitch_helper"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s 

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: twitch-helper-auth-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8080"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: twitch-helper-user-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8080"

  twitch-service:
    build:
      context: ./twitch-service
      dockerfile: Dockerfile
    container_name: twitch-helper-twitch-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/twitch_helper
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8083:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twitch-helper-frontend
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      twitch-service:
        condition: service_started
    ports:
      - "3000:3000"

  e2e-tests:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: twitch-helper-e2e-tests
    depends_on:
      frontend:
        condition: service_started
    environment:
      CYPRESS_baseUrl: http://frontend:3000
    volumes:
      - ./e2e/cypress:/e2e/cypress
      - ./e2e/cypress.config.js:/e2e/cypress.config.js
      - ./test-results/videos:/e2e/cypress/videos
      - ./test-results/screenshots:/e2e/cypress/screenshots
    profiles:
      - test

volumes:
  postgres_data:
