name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Unit-tests (без Docker, быстро)
  # ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests — auth-service
        working-directory: twitch-helper-docker/auth-service
        run: mvn test --no-transfer-progress

      - name: Run unit tests — user-service
        working-directory: twitch-helper-docker/user-service
        run: mvn test --no-transfer-progress

      - name: Run unit tests — chat-bot-service
        working-directory: twitch-helper-docker/chat-bot-service
        run: mvn test --no-transfer-progress

      - name: Run unit tests — twitch-service
        working-directory: twitch-helper-docker/twitch-service
        run: mvn test --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            twitch-helper-docker/auth-service/target/surefire-reports/
            twitch-helper-docker/user-service/target/surefire-reports/
            twitch-helper-docker/chat-bot-service/target/surefire-reports/
            twitch-helper-docker/twitch-service/target/surefire-reports/

  # ──────────────────────────────────────────
  # JOB 2: E2E + Load tests (с Docker)
  # ──────────────────────────────────────────
  e2e-and-load-tests:
    name: E2E & Load Tests
    runs-on: ubuntu-latest
    needs: unit-tests   # запускается только если unit-tests прошли

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infrastructure (DB + services + frontend)
        env:
          TWITCH_BOT_USERNAME: ${{ secrets.TWITCH_BOT_USERNAME }}
          TWITCH_BOT_OAUTH_TOKEN: ${{ secrets.TWITCH_BOT_OAUTH_TOKEN }}
          TWITCH_CHANNEL_NAME: ${{ secrets.TWITCH_CHANNEL_NAME }}
          OUR_CLIENT_ID: ${{ secrets.OUR_CLIENT_ID }}
          OUR_CLIENT_SECRET: ${{ secrets.OUR_CLIENT_SECRET }}
        working-directory: twitch-helper-docker
        run: |
          docker compose up -d --build db auth-service user-service twitch-service chat-bot-service frontend
          docker compose ps

      - name: Wait for services to be healthy
        working-directory: twitch-helper-docker
        run: |
          echo "Waiting for services..."
          sleep 30

      - name: Run E2E tests
        working-directory: twitch-helper-docker
        run: docker compose --profile e2e-test up --build --abort-on-container-exit e2e-tests

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/

      - name: Run Load tests
        working-directory: twitch-helper-docker
        run: docker compose --profile load-test up --build --abort-on-container-exit load-tests

      - name: Upload Load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-tests/results/

      - name: Tear down
        if: always()
        working-directory: twitch-helper-docker
        run: docker compose down -v
